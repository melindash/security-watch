name: Detect upstream security releases

# Adobe publishes no RSS, JSON or CSAF feed, and since July 2026 its isolated
# security releases are not tagged on public GitHub at all. The bulletin index is
# the only source that sees them; GHSA and Packagist add structured CVE metadata
# and version constraints.

on:
  schedule:
    # Hourly. The previous daily 10:27 slot rested on "upstream ships monthly", which
    # is true of scheduled releases and false of out-of-band ones: APSB26-146 shipped
    # on a Monday afternoon with no warning.
    #
    # The declared minute is close to meaningless here. Measured over the last ten
    # scheduled runs, GitHub started this workflow a median of 4.2h after 10:27, worst
    # case 7.2h, never sooner than 3.0h. Daily cadence plus that drift put worst-case
    # detection latency near 31h. Hourly does not remove the drift, but a delayed or
    # dropped slot is then followed by another within the hour instead of the next day.
    #
    # More polling adds no issue noise: findings fire only on ids absent from
    # state/seen.json, so a quiet hour costs one ~20s run and writes nothing.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: detect-security
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect new security releases
        id: detect
        env:
          # The advisories API is public, but unauthenticated calls are limited to 60/h
          # per IP and Actions runners share addresses. Hourly runs now page GHSA four
          # deep, so an anonymous run can be throttled into a silent empty result.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node bin/detect-security.js --write --report=new-findings.json
          echo "count=$(node -p "require('./new-findings.json').new")" >> "$GITHUB_OUTPUT"

      # The state file is uploaded, not committed. Committing here would mark a
      # bulletin seen before `track` has opened an issue for it, so any failure in
      # `track` would bury the finding permanently: the next run reads it as old and
      # re-running the workflow does not recover it. The `record` job below commits
      # only once tracking has actually succeeded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detect-output
          path: |
            new-findings.json
            state/seen.json

  track:
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: detect-output

      - name: Determine supported lines
        id: lines
        uses: mage-os/github-actions/supported-version@main
        with:
          project: 'mage-os'
          kind: 'currently-supported'

      - name: Open tracking issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('new-findings.json', 'utf8'));

            // One checklist row per supported line, so the issue states plainly
            // what is outstanding rather than implying a single port suffices.
            let lines = [];
            try {
              const matrix = JSON.parse(process.env.SUPPORTED_MATRIX || '{}');
              lines = (matrix.include || [])
                .map(entry => entry.line ? `${entry.line} (${entry.magento})` : entry.magento)
                .filter(Boolean);
            } catch (error) {
              core.warning(`could not parse supported version matrix: ${error.message}`);
            }
            if (lines.length === 0) lines = ['(supported lines unavailable)'];

            for (const finding of report.findings) {
              const title = `[${finding.key.toUpperCase()}] upstream security release`;

              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                labels: `advisory:${finding.key}`,
              });
              if (existing.data.length) {
                core.info(`${finding.key} already tracked in #${existing.data[0].number}`);
                continue;
              }

              const body = [
                `Detected via: **${finding.sources.join(', ')}**`,
                finding.severity ? `Severity: **${finding.severity}**` : null,
                finding.url ? `Source: ${finding.url}` : null,
                '',
                finding.cves.length ? `CVEs: ${finding.cves.join(', ')}` : null,
                finding.versions && finding.versions.length
                  ? `Versions referenced: ${finding.versions.join(', ')}`
                  : null,
                finding.affectedVersions ? `Affected: \`${finding.affectedVersions}\`` : null,
                '',
                '### Port status',
                ...lines.map(line => `- [ ] ${line}`),
                '- [ ] advisory published',
                '- [ ] released',
                '',
                '---',
                'Adobe ships isolated patches as `vendor/`-level files. Translate them with',
                '`bin/translate-patch.js` in generate-mirror-repo-js rather than remapping paths by hand.',
              ].filter(part => part !== null).join('\n');

              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', `advisory:${finding.key}`],
              });
              core.info(`opened #${created.data.number} for ${finding.key}`);
            }
        env:
          SUPPORTED_MATRIX: ${{ steps.lines.outputs.matrix }}

      - name: Notify Discord
        if: env.DISCORD_WEBHOOK != ''
        uses: Ilshidur/action-discord@0c4b27844ba47cb1c7bee539c8eead5284ce9fa9
        with:
          args: "${{ needs.detect.outputs.count }} new upstream security release(s) detected. See ${{ github.server_url }}/${{ github.repository }}/issues?q=is%3Aissue+is%3Aopen+label%3Asecurity"

  # Commits the baseline only after tracking has run, so a failure anywhere upstream
  # leaves state untouched and the next scheduled run re-reports the same finding.
  # The state file is carried over from `detect` rather than regenerated, so a bulletin
  # published between the two jobs is not silently absorbed into the baseline.
  record:
    needs: [detect, track]
    if: always() && needs.detect.result == 'success' && needs.track.result != 'failure' && needs.track.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: detect-output

      - name: Commit updated state
        run: |
          if git diff --quiet -- state/seen.json; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/seen.json
          git commit -m "Record newly detected security releases"
          git push
